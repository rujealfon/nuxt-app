services:
  postgres:
    image: postgres:18-alpine
    container_name: nuxt-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nuxt_app_user
      POSTGRES_PASSWORD: nuxt_app_password
      POSTGRES_DB: nuxt_app_db
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U nuxt_app_user -d nuxt_app_db]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: nuxt-app-redis
    restart: unless-stopped
    ports:
      - '6381:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  drizzle-studio:
    build:
      context: .
      dockerfile: docker/drizzle-studio/Dockerfile
    container_name: nuxt-app-drizzle-studio
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nuxt_app_user:nuxt_app_password@postgres:5432/nuxt_app_db
    ports:
      - '4984:4983'
    volumes:
      - ./apps/api/drizzle.config.ts:/app/apps/api/drizzle.config.ts:ro
      - ./apps/api/server/database:/app/apps/api/server/database:ro

volumes:
  postgres-data:
  redis-data:
