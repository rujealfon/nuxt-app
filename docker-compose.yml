services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuxt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuxt}
      POSTGRES_DB: ${POSTGRES_DB:-nuxt_app}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER:-nuxt} -d ${POSTGRES_DB:-nuxt_app}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      API_PORT: 3001
      API_HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-nuxt}:${POSTGRES_PASSWORD:-nuxt}@postgres:5432/${POSTGRES_DB:-nuxt_app}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string-at-least-32-chars}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3002}
      WEB_URL: ${WEB_URL:-http://localhost:3003}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"

      interval: 10s
      timeout: 5s
      retries: 10

  drizzle-studio:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    command: pnpm --filter @nuxt-app/db exec drizzle-kit studio --host 0.0.0.0 --port 4983
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nuxt}:${POSTGRES_PASSWORD:-nuxt}@postgres:5432/${POSTGRES_DB:-nuxt_app}
    ports:
      - '127.0.0.1:4983:4983'
    volumes:
      - ./packages/db/src:/repo/packages/db/src
      - ./packages/db/drizzle.config.ts:/repo/packages/db/drizzle.config.ts
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.nuxt
      args:
        PACKAGE: '@nuxt-app/app'
        APP_DIR: apps/app
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.nuxt
      args:
        PACKAGE: '@nuxt-app/admin'
        APP_DIR: apps/admin
    ports:
      - '3002:3000'
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.static
      args:
        PACKAGE: '@nuxt-app/web'
        APP_DIR: apps/web
    ports:
      - '3003:80'

volumes:
  postgres_data:
