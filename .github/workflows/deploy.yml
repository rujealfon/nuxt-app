name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Require main and successful CI for this commit
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              core.setFailed('Run production deployment from the main branch.')
              return
            }

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              head_sha: context.sha,
              per_page: 1,
            })
            const run = data.workflow_runs[0]
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed('The latest main CI run for this commit must succeed before deployment. Wait for CI or fix the failure, then run this workflow again.')
              return
            }
            core.info(`Deploying ${context.sha}, verified by ${run.html_url}`)

  deploy:
    needs: verify-deployment
    # Leave this repository variable unset until Vercel is configured.
    if: vars.VERCEL_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID_API: ${{ vars.VERCEL_PROJECT_ID_API }}
      VERCEL_PROJECT_ID_WEB: ${{ vars.VERCEL_PROJECT_ID_WEB }}
      VERCEL_PROJECT_ID_APP: ${{ vars.VERCEL_PROJECT_ID_APP }}
      VERCEL_PROJECT_ID_ADMIN: ${{ vars.VERCEL_PROJECT_ID_ADMIN }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          for setting in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID_API VERCEL_PROJECT_ID_WEB VERCEL_PROJECT_ID_APP VERCEL_PROJECT_ID_ADMIN; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Configure $setting in the production environment or repository settings."
              exit 1
            fi
          done

      - name: Checkout the verified commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@60.1.3

      # Upload the entire workspace. Each linked project's rootDirectory selects
      # apps/<name>, and Vercel builds with that project's production settings.
      - name: Deploy API and frontends
        shell: bash
        run: |
          for app in API WEB APP ADMIN; do
            project_setting="VERCEL_PROJECT_ID_${app}"
            export VERCEL_PROJECT_ID="${!project_setting}"
            rm -rf .vercel
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            deployment_url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
            printf '%s: %s\n' "$app" "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
          done

  release:
    needs: [verify-deployment, deploy]
    # Temporary release-only mode while Vercel is unconfigured. Once enabled,
    # every production deployment must succeed before publishing a release.
    if: >-
      !cancelled() && needs['verify-deployment'].result == 'success' &&
      (needs.deploy.result == 'success' ||
      (needs.deploy.result == 'skipped' && vars.VERCEL_DEPLOYMENT_ENABLED != 'true'))
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
