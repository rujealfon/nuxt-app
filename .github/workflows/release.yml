name: Release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # semantic-release only needs the devDependencies; skipping lifecycle
      # scripts avoids the Nuxt prepare step this job does not use.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Require selected commit to remain at the head of main
        shell: bash
        run: |
          release_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$release_head" != "$GITHUB_SHA" ]]; then
            echo "::error::main advanced after this workflow started. Run Deploy production for the latest main commit after CI succeeds to publish its release."
            exit 1
          fi

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
