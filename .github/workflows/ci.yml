name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://nuxt:nuxt@localhost:5432/nuxt_app
  DATABASE_URL_TEST: postgres://nuxt:nuxt@localhost:5432/nuxt_app_test

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: nuxt
          POSTGRES_PASSWORD: nuxt
          POSTGRES_DB: nuxt_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuxt -d nuxt_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Check Drizzle migrations
        run: pnpm db:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
