# Dependabot opens pull requests that bump outdated dependencies, so you review
# a version change instead of checking registries yourself.
#
# Minor and patch npm updates share one pull request. Each major stays separate.
# Commit titles are Conventional Commits so the commitlint title check passes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
      include: scope
    # Keep the preset on 9.3.x. Version 10 needs writer 9; semantic-release ships writer 8.
    # @types/node majors follow Node majors. This repo stays on Node 22.
    ignore:
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    groups:
      js-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
